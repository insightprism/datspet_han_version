[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pet_factory"
version = "1.0.0"
description = "Animal name -> a ready-to-use DatsMe pet bundle (.zip), generated locally with Z-Image + Wan 2.2 + birefnet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "requests>=2.28",
    "rembg>=2.0.56",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.19"]
cpu = ["onnxruntime>=1.16"]
examples = ["flask>=3"]

[tool.setuptools]
packages = ["pet_factory"]
