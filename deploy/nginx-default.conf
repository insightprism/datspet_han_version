# pet.datsme.me vhost — mounted into the datspet-nginx container as
# /etc/nginx/conf.d/default.conf (see deploy/README.md). Static export at /,
# backend surfaces proxied to the host (172.18.0.1 = the sales_ai_net bridge
# gateway; the UFW bridge rule must allow the backend port — see README).

# Rate limits (§7 step 9): the generation endpoints drive real GPU minutes on
# the pool, and pet.datsme.me accepts standalone (anonymous) designers — so
# per-IP limits are the DoS fence. Zones are http-context; conf.d files are
# included inside http{}.
limit_req_zone $binary_remote_addr zone=datspet_gen:10m rate=6r/m;   # GPU-heavy
limit_req_zone $binary_remote_addr zone=datspet_api:10m rate=10r/s;  # everything else
# Arena room impulses (SPEC_PET_ARENA_ROOMS §5.3): batched POSTs every
# IMPULSE_BATCH_MS per player. Sized for the tick rate, not a human clicking
# Generate — and per-IP, so siblings racing behind one home NAT share it.
limit_req_zone $binary_remote_addr zone=datspet_arena:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name pet.datsme.me;

    client_max_body_size 20M;   # uploads are capped at 12 MB by the backend

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # GPU-heavy endpoints, exact POST paths only. /api/reference is here too: it is
    # the fill step, and two of its three doors cost a ~10 s render (a typed animal
    # draws an archetype; a photo gets redrawn). Only the curated-base door is free,
    # and the rate limiter cannot tell them apart from the path.
    #
    # Image fetches fall through to the general zone — that is GET
    # /api/reference/{id}.png now; the /api/preview/{id} this used to name was
    # deleted with the legacy contract (SPEC_PET_DESIGNER_FLOW build step 7).
    #
    # A human designer previews and generates a few times a minute; a scraper
    # burning pool GPU gets 429s.
    location ~ ^/api/(generate|preview|reference)$ {
        limit_req zone=datspet_gen burst=4 nodelay;
        proxy_pass http://172.18.0.1:19954;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;   # /api/preview blocks up to ~3 min on a cold pool worker
        client_max_body_size 20M;
    }

    # Arena room SSE stream (SPEC_PET_ARENA_ROOMS §3.2, §5.1). proxy_buffering
    # MUST be off: buffered, the browser receives nothing until nginx's buffer
    # flushes — the race looks frozen, then jumps, and it reads as an app bug.
    # No rate limit: a stream is ONE long request per viewer, and the §5.2
    # heartbeat (not this file) is what keeps the OUTER proxy's 60 s idle
    # default from cutting it. Regex locations match in order — this must stay
    # above the general /(api|partner|launch) block.
    location ~ ^/api/arena/.*stream {
        proxy_pass http://172.18.0.1:19954;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    # Arena room impulse batches (SPEC_PET_ARENA_ROOMS §3.3, §5.3) — their own
    # zone, so five children answering fast are never throttled by the same
    # counter as a scraper hitting Generate.
    location ~ ^/api/arena/rooms/[A-Za-z0-9_-]+/impulses$ {
        limit_req zone=datspet_arena burst=40 nodelay;
        proxy_pass http://172.18.0.1:19954;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Backend surfaces: the API, the DPP partner endpoints, and the launch
    # entrypoint (same-origin with the static frontend — spec C.2/C.5, R4-1).
    location ~ ^/(api|partner|launch) {
        limit_req zone=datspet_api burst=20 nodelay;
        proxy_pass http://172.18.0.1:19954;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 20M;
    }

    # /design — the DPP launch deep-link target. The host redirects "Design a pet"
    # here (return=/design), so it must answer, and it must answer FAST: it is the
    # first thing a launching user sees.
    #
    # The designer lives at /design/general (SPEC_PET_DESIGNER_FLOW §11 deleted the
    # world tiles that used to live here), and web/src/app/design/page.tsx redirects.
    # That redirect is server-side under `next dev` — and NOT in prod. Verified by
    # building the export: out/design.html IS emitted, but its body is empty and the
    # hop rides a `NEXT_REDIRECT;replace;/design/general;307` payload in the RSC
    # flight data. No meta-refresh. So nginx would serve a 200 blank page and the
    # redirect would happen in JS, after a paint — exactly the "screen whose only
    # purpose is to leave" that page.tsx says it chose a server redirect to avoid,
    # and broken outright for a client that runs no JS.
    #
    # An exact-match location beats the `location /` prefix below, so this fires
    # before try_files ever sees /design and design.html is never served.
    # $is_args$args keeps the query: ?from=datsme is dropped by the route's
    # hardcoded redirect, and nothing reads it today, but a redirect that quietly
    # eats its query is a trap for whoever adds the first thing that does.
    location = /design {
        return 307 /design/general$is_args$args;
    }

    # The spectator URL (SPEC_PET_ARENA_ROOMS R3): /arena/{code} serves the
    # static watch shell — the export cannot host a dynamic segment, so the
    # path stays in the browser and the page reads the code from
    # window.location. (?!watch$) keeps /arena/watch itself on try_files.
    location ~ "^/arena/(?!watch$)[A-Za-z0-9_-]{8,24}$" {
        root /usr/share/nginx/html;
        try_files /arena/watch.html =404;
        add_header Cache-Control "no-cache";
    }

    # Build assets under /_next/static are CONTENT-HASHED — the filename changes
    # whenever the bytes do (chunks/117-754f967a3459e24a.js), so a stale copy is
    # impossible by construction and they can be cached forever. `^~` stops nginx
    # evaluating the regex locations above for this prefix.
    location ^~ /_next/static/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static export (next build with DATSPET_STATIC_EXPORT=1 -> out/)
    #
    # `Cache-Control: no-cache` is REQUIRED here, and is not the same as "don't
    # cache": it means "you may store this, but revalidate before reuse". The etag
    # makes that ~free — a browser sends If-None-Match and gets a 304 with no body.
    #
    # Without it we sent only Last-Modified + ETag and NO Cache-Control, which does
    # not mean "always ask". With no explicit directive an HTTP cache may apply a
    # HEURISTIC freshness lifetime (RFC 9111 §4.2.2) — commonly ~10% of the
    # document's age — so a browser can serve a stale page for HOURS without ever
    # contacting us. That bit a real user right after the 2026-07-15 designer
    # deploy: pet.datsme.me/design?from=datsme rendered the DELETED world-tiles
    # landing from cache while the server was correctly 307ing. Unlike the routes
    # this file's other comments are about, that failure survives a correct deploy
    # and cannot be seen from the server side at all.
    #
    # This block covers the HTML and the RSC .txt payloads beside it — everything
    # whose URL is stable across builds, which is exactly what must revalidate.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
